<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFS Copperleaf — 2026 Europe Campaign Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b12;--bg2:#111119;--bg3:#17172a;--bg4:#1e1e30;--bg5:#25253a;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);--border3:rgba(255,255,255,0.18);
  --text:#eeeef8;--text2:#9898b8;--text3:#55556a;
  --purple:#7b6cf8;--purple2:#a99dfc;--purple-d:rgba(123,108,248,0.14);
  --teal:#2dd4a0;--teal-d:rgba(45,212,160,0.11);
  --amber:#f5a623;--amber-d:rgba(245,166,35,0.11);
  --blue:#4daeff;--blue-d:rgba(77,174,255,0.11);
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --elec:#f5a623;--elec-d:rgba(245,166,35,0.12);
  --egas:#a78bfa;--egas-d:rgba(167,139,250,0.12);
  --ngas:#e879f9;--ngas-d:rgba(232,121,249,0.12);
  --water:#38bdf8;--water-d:rgba(56,189,248,0.12);
  --airports:#fb923c;--airports-d:rgba(251,146,60,0.12);
  --rail:#4ade80;--rail-d:rgba(74,222,128,0.12);
  --oilgas:#94a3b8;--oilgas-d:rgba(148,163,184,0.12);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.page-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:20px 40px 0;position:sticky;top:0;z-index:200;backdrop-filter:blur(12px)}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:16px;flex-wrap:wrap}
.brand-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.brand-dot{width:7px;height:7px;border-radius:50%;background:var(--purple);flex-shrink:0}
.brand-text{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.page-title{font-size:26px;font-weight:600;color:var(--text);letter-spacing:-.025em}
.goals-row{display:flex;gap:8px;flex-wrap:wrap}
.goal-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 15px;min-width:110px}
.goal-label{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.goal-val{font-size:18px;font-weight:600;color:var(--text);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.goal-of{font-size:12px;font-weight:400;color:var(--text3)}
.goal-pct{font-size:11px;color:var(--text3);margin-top:1px}
.goal-bar{height:2px;background:var(--border2);border-radius:2px;margin-top:7px;overflow:hidden}
.goal-fill{height:100%;border-radius:2px}

/* ── PRIMARY NAV (Account Heat | ABM Campaigns) ── */
.primary-nav{display:flex;border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.primary-nav::-webkit-scrollbar{display:none}
.primary-tab{padding:11px 22px;font-size:14px;font-family:var(--font);font-weight:400;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
.primary-tab:hover{color:var(--text2)}
.primary-tab.active{color:var(--purple2);border-bottom-color:var(--purple);font-weight:600}

/* ── SECONDARY NAV (All | UKI | CEU | SEU) ── */

/* ── MAIN ── */
.main{padding:28px 40px 80px;max-width:1380px;margin:0 auto}

/* ── REGION TAB BAR (inside ABM view) ── */
.region-tab-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.region-btn{padding:8px 20px;font-size:13px;font-family:var(--font);font-weight:500;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.region-btn:hover{border-color:var(--border3);color:var(--text);background:var(--bg4)}
.region-btn.active{background:var(--purple-d);border-color:var(--purple);color:var(--purple2)}

/* ── FILTER PILLS ── */
.filter-bar{display:flex;align-items:center;gap:7px;margin-bottom:20px;flex-wrap:wrap}
.filter-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-right:2px}
.filter-pill{padding:5px 13px;font-size:12px;font-family:var(--font);border-radius:100px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-pill:hover{border-color:var(--border3);color:var(--text)}
.filter-pill.active{border-color:var(--purple);background:var(--purple-d);color:var(--purple2)}

/* ── SUMMARY STRIP ── */

/* ── REGION GROUP ── */
.region-group{margin-bottom:36px}
.region-heading{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.region-name{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text2)}
.region-line{flex:1;height:1px;background:var(--border)}
.region-count{font-size:11px;color:var(--text3);font-family:var(--mono)}
.industry-group{margin-bottom:20px}
.industry-heading{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.industry-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.industry-name{font-size:12px;font-weight:500}
.cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

/* ── CAMPAIGN CARD ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:13px;transition:border-color .2s,transform .15s}
.card:hover{border-color:var(--border2);transform:translateY(-1px)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-title{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.015em;line-height:1.2}
.card-subtitle{font-size:11px;color:var(--text3);margin-top:4px}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.status{font-size:10px;font-weight:500;padding:3px 9px;border-radius:100px;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.05em;border:1px solid transparent}
.s-live{background:var(--teal-d);color:var(--teal);border-color:rgba(45,212,160,.2)}
.s-paused{background:var(--amber-d);color:var(--amber);border-color:rgba(245,166,35,.2)}
.obj-block{background:var(--purple-d);border:1px solid rgba(123,108,248,0.18);border-radius:9px;padding:11px 14px}
.obj-label{font-size:10px;font-weight:600;color:var(--purple2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.obj-label::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--purple);flex-shrink:0}
.obj-text{font-size:12px;color:var(--text);line-height:1.55}
.channels-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ch-label{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.ch-tag{font-size:10px;font-weight:500;padding:3px 8px;border-radius:5px;background:var(--bg4);color:var(--text2);border:1px solid var(--border2);white-space:nowrap}
.card-divider{height:1px;background:var(--border)}
.pipe-block{background:var(--bg3);border-radius:9px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pipe-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.pipe-val{font-size:22px;font-weight:600;color:var(--text);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.pipe-stage{font-size:11px;color:var(--text3);text-align:right;line-height:1.4;max-width:160px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.stat{background:var(--bg3);border-radius:7px;padding:8px 9px}
.stat-n{font-size:14px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;line-height:1}
.stat-d{font-size:10px;color:var(--text3);margin-top:3px;line-height:1.3}
.bullets{list-style:none;display:flex;flex-direction:column;gap:6px}
.bullets li{font-size:12px;color:var(--text2);display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.bullets li::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--purple);flex-shrink:0;margin-top:5px}
.card-footer{border-top:1px solid var(--border);padding-top:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.next-label{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.next-text{font-size:11px;color:var(--text2);line-height:1.45}
.cta-btn{font-size:11px;font-family:var(--font);font-weight:500;padding:6px 13px;border:1px solid var(--border2);border-radius:7px;background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:all .15s;text-decoration:none;flex-shrink:0}
.cta-btn:hover{background:var(--purple-d);border-color:var(--purple);color:var(--purple2)}
.empty{padding:60px 20px;text-align:center;color:var(--text3);font-size:14px}

/* ── ACCOUNT HEAT ── */
.heat-explainer{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:20px}
.heat-explainer-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:12px}
.heat-tiers{display:flex;gap:10px;flex-wrap:wrap}
.heat-tier{display:flex;align-items:center;gap:10px;background:var(--bg3);border-radius:8px;padding:10px 14px;flex:1;min-width:190px}
.tier-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tier-pts{font-size:12px;font-weight:600;color:var(--text)}
.tier-desc{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.35}
.heat-legend{display:flex;gap:14px;align-items:center;margin-bottom:20px;flex-wrap:wrap;padding:12px 16px;background:var(--bg3);border-radius:8px;border:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);white-space:nowrap}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.heat-region-block{margin-bottom:32px}
.heat-table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;overflow-x:auto}
.heat-table{width:100%;border-collapse:collapse;min-width:700px}
.heat-table th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:10px 16px;text-align:left;background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap}
.heat-table th.r{text-align:right}
.heat-table td{padding:11px 16px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border);vertical-align:middle}
.heat-table tr:last-child td{border-bottom:none}
.heat-table tr:hover td{background:rgba(255,255,255,0.015)}
.heat-table td.r{text-align:right}
.acct-name{font-size:13px;font-weight:500;color:var(--text)}
.acct-tags{margin-top:3px;display:flex;gap:4px;flex-wrap:wrap}
.abm-tag{font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.abm-active{background:var(--teal-d);color:var(--teal);border:1px solid rgba(45,212,160,.2)}
.abm-paused{background:var(--amber-d);color:var(--amber);border:1px solid rgba(245,166,35,.2)}
.abm-few{background:var(--blue-d);color:var(--blue);border:1px solid rgba(77,174,255,.2)}
.flag-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--amber-d);color:var(--amber);border:1px solid rgba(245,166,35,.3)}
.score-wrap{display:flex;align-items:center;gap:8px}
.score-num{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.score-bar-bg{flex:1;height:4px;background:var(--bg5);border-radius:2px;overflow:hidden;min-width:50px}
.score-bar-fill{height:100%;border-radius:2px}
.score-tier-label{font-size:10px;margin-top:3px;opacity:.85}
.ind-badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.abm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.dot-active{background:var(--teal);box-shadow:0 0 5px rgba(45,212,160,.4)}
.dot-few{background:var(--blue);box-shadow:0 0 5px rgba(77,174,255,.3)}
.dot-paused{background:var(--amber)}
.dot-flag{background:var(--amber);box-shadow:0 0 6px rgba(245,166,35,.5)}
.dot-none{background:var(--bg5);border:1px solid var(--border2)}
.flag-alert{font-size:11px;color:var(--amber)}

/* ── MISC ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:3px}
@media(max-width:760px){
  .page-header{padding:14px 16px 0}
  .main{padding:18px 16px 50px}
  .page-title{font-size:20px}
  .cards-row{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>

    <div class="filter-bar">

      <button class="filter-pill" onclick="setIndustry('Electricity &amp; Gas',this)">Electricity &amp; Gas</button>
      <button class="filter-pill" onclick="setIndustry('Water',this)">Water</button>
      <button class="filter-pill" onclick="setIndustry('Airports',this)">Airports</button>
      <button class="filter-pill" onclick="setIndustry('Rail',this)">Rail</button>
    </div>
  </div>

  <!-- VIEWS -->
  <div id="heat-view"></div>
  <div id="abm-view" style="display:none"></div>
</main>

/* ══ HELPERS ══ */
function fmtPipe(raw) {
  if (!raw) return '—';
  if (raw >= 1e6) return '€' + (raw/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (raw >= 1e3) return '€' + Math.round(raw/1e3) + 'K';
  return '€' + raw;
}
function statusClass(s) { return s==='live'?'s-live':'s-paused'; }
function statusLabel(s) { return s==='live'?'Live':'Paused'; }

function engTier(eng) {
  if (eng >= 60) return {color:'#2dd4a0', label:'Sales conversation / demo in motion'};
  if (eng >= 25) return {color:'#a78bfa', label:'Webinar or event attended'};
  return              {color:'#55556a',  label:'Web & product page visits'};
}

/* ══ RENDER ABM CAMPAIGNS ══ */
function renderABM() {
  const filtered = CAMPAIGNS.filter(c =>
    (activeRegion === 'all' || c.region === activeRegion) &&
    (activeIndustry === 'all' || c.industry === activeIndustry)
  );

  // update summary
  const total = filtered.reduce((s,c) => s + c.pipeRaw, 0);

  if (!filtered.length) {
    document.getElementById('abm-view').innerHTML = '<div class="empty">No campaigns match this filter.</div>';
    return;
  }

  const regions = activeRegion === 'all' ? ['UKI','CEU','SEU'] : [activeRegion];
  let html = '';

  for (const r of regions) {
    const rC = filtered.filter(c => c.region === r);
    if (!rC.length) continue;

    html += `<div class="region-group">
      ${activeRegion === 'all' ? `<div class="region-heading">
        <span class="region-name">${REG_LABELS[r]}</span>
        <span class="region-line"></span>
        <span class="region-count">${rC.length} campaign${rC.length!==1?'s':''}</span>
      </div>` : ''}`;

    const inds = activeIndustry === 'all'
      ? IND_ORDER.filter(i => rC.some(c => c.industry === i))
      : [activeIndustry];

    for (const ind of inds) {
      const iC = rC.filter(c => c.industry === ind);
      if (!iC.length) continue;
      const cfg = IND_CONFIG[ind] || {color:'var(--text3)',bg:'var(--bg4)'};
      html += `<div class="industry-group">
        <div class="industry-heading">
          <span class="industry-dot" style="background:${cfg.color}"></span>
          <span class="industry-name" style="color:${cfg.color}">${ind}</span>
        </div>
        <div class="cards-row">${iC.map(c => cardHTML(c, cfg)).join('')}</div>
      </div>`;
    }
    html += '</div>';
  }

  document.getElementById('abm-view').innerHTML = html;
}

function cardHTML(c, cfg) {
  return `<div class="card">
    <div class="card-head">
      <div>
        <p class="card-title">${c.name}</p>
        <p class="card-subtitle">${c.subtitle}</p>
        <div class="card-tags">
          <span class="tag" style="background:${cfg.bg};color:${cfg.color}">${c.industry}</span>
          <span class="tag" style="background:var(--bg4);color:var(--text3);border:1px solid var(--border2)">${c.abmType}</span>
        </div>
      </div>
      <span class="status ${statusClass(c.status)}">${statusLabel(c.status)}</span>
    </div>
    <div class="obj-block">
      <p class="obj-label">Why this campaign was launched</p>
      <p class="obj-text">${c.objective}</p>
    </div>
    <div class="channels-row">
      <span class="ch-label">Channels</span>
      ${c.channels.map(ch=>`<span class="ch-tag">${ch}</span>`).join('')}
    </div>
    <div class="card-divider"></div>
    <div class="pipe-block">
      <div><p class="pipe-label">Pipeline influenced</p><p class="pipe-val">${c.pipe}</p></div>
      <p class="pipe-stage">${c.stage}</p>
    </div>
    <div class="stats-grid">
      ${c.stats.map(s=>`<div class="stat"><p class="stat-n">${s.n}</p><p class="stat-d">${s.d}</p></div>`).join('')}
    </div>
    <ul class="bullets">${c.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
    <div class="card-footer">
      <div><p class="next-label">What's next</p><p class="next-text">${c.next}</p></div>
      <a class="cta-btn" href="${c.link}" target="_blank">Full deck ↗</a>

  </div>`;
}
